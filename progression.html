<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Progression</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Progression">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet"><style>
:root {
  --bg: #0c0c0e;
  --surface: #161618;
  --surface2: #1e1e22;
  --border: #2a2a30;
  --border2: #383840;
  --text: #f0f0f2;
  --text2: #a0a0aa;
  --text3: #606068;
  --accent: #e8ff5a;
  --accent-dark: #b8cc3a;
  --green: #3de08a;
  --green-dim: #1a5c3a;
  --amber: #ffb547;
  --amber-dim: #5c3e10;
  --blue: #5ab4ff;
  --blue-dim: #1a3a5c;
  --red: #ff5a5a;
  --r: 12px;
  --r-sm: 8px;
  --r-xs: 6px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html { background: var(--bg); overflow-x: hidden; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom, 20px);
}

/* HEADER */
.header {
  padding: 16px 16px 16px;
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid var(--border);
}

.header-top {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.logo {
  font-family: 'Syne', sans-serif;
  font-size: 34px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.02em;
  flex-shrink: 0;
}

.logo span { color: var(--accent); }

.stats-row {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

.stat-chip {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 46px;
}

.stat-chip-n {
  font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.05em;
  font-size: 20px;
  font-weight: 400;
  color: var(--text);
  line-height: 1;
  letter-spacing: 0.05em;
}

.stat-chip-n.amber { color: var(--amber); }



.stat-chip-l {
  font-size: 9px;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 500;
  margin-top: 1px;
}

/* BANNER */
.banner {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 10px 14px;
  font-size: 13px;
  color: var(--text2);
  margin: 16px 20px 20px;
}

.banner-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.banner-dot.active { background: var(--green); box-shadow: 0 0 6px var(--green); }
.banner-dot.rest { background: var(--text3); }
.banner strong { color: var(--text); font-weight: 600; }

/* TABS */
.tabs-wrap {
  padding: 16px 20px 20px;
  background: var(--bg);
}

.tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.tab {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--r-sm);
  padding: 10px 6px 8px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
  -webkit-user-select: none;
  user-select: none;
}

.tab-label {
  font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.05em;
  font-size: 17px;
  font-weight: 400;
  color: var(--text);
  letter-spacing: 0.08em;
  display: block;
}

.tab-sub {
  font-size: 10px;
  font-weight: 700;
  color: var(--text2);
  display: block;
  margin-top: 2px;
  white-space: normal;
  word-break: break-word;
  line-height: 1.3;
}

.tab.active {
  background: var(--accent);
  border-color: var(--accent);
}

.tab.active .tab-label { color: #0c0c0e; }
.tab-flag { color: var(--amber); }
.tab.active .tab-flag { color: #0c0c0e; }
.tab.active .tab-sub { color: rgba(12,12,14,0.6); }


.tab-pip {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--green);
  margin: 4px auto 0;
}

.tab.active .tab-pip { background: rgba(12,12,14,0.5); }

/* SESSION */
.session {
  padding: 16px 16px 0;
}

.session-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  margin-bottom: 16px;
}

.session-header {
  padding: 16px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.session-info {}

.session-day {
  font-family: 'Syne', sans-serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.01em;
}

.session-type {
  font-size: 12px;
  color: var(--text3);
  margin-top: 2px;
}

.session-btns {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.btn {
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 12px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: var(--r-xs);
  cursor: pointer;
  border: 1px solid;
  transition: all 0.15s;
  white-space: nowrap;
}

.btn-primary {
  background: transparent;
  border-color: var(--accent);
  color: var(--accent);
}

.btn-primary:active {
  background: var(--accent);
  border-color: var(--accent);
  color: #0c0c0e;
}

.btn-ghost {
  background: transparent;
  border-color: var(--border2);
  color: var(--text3);
}

.btn-ghost:active { background: var(--surface2); }

/* MUSCLE GROUP */
.muscle-label {
  padding: 8px 18px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text3);
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  border-top: 1px solid var(--border);
}

/* EXERCISE ROW */
.ex {
  display: flex;
  align-items: center;
  padding: 13px 18px;
  border-bottom: 1px solid var(--border);
  gap: 12px;
}

.ex:last-child { border-bottom: none; }

.ex-info { flex: 1; min-width: 0; }

.ex-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 6px;
  white-space: normal;
  word-break: break-word;
}


.ex-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  align-items: center;
}

.pill {
  font-size: 10px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 20px;
  white-space: nowrap;
  letter-spacing: 0.02em;
}

.pill-sets {
  background: transparent;
  color: var(--text);
  padding: 0;
  font-size: 12px;
  font-weight: 600;
}

.pill-reps {
  background: transparent;
  color: var(--blue);
  padding: 0;
  font-size: 12px;
  font-weight: 600;
}
.pill-sep {
  color: var(--text3);
  font-weight: 400;
}
.pill-range {
  color: var(--text3);
  font-weight: 400;
  font-size: 11px;
}

.pill-flag {
  background: var(--amber);
  color: #0c0c0e;
  cursor: pointer;
  font-size: 10px;
  padding: 3px 8px;
  font-weight: 600;
  letter-spacing: 0.02em;
  animation: pulse-flag 2s ease-in-out infinite;
}
.pill-flag:active { opacity: 0.8; transform: scale(0.96); }

.pill-guide {
  background: var(--blue-dim);
  color: var(--blue);
  cursor: pointer;
  font-size: 10px;
  padding: 3px 8px;
  font-weight: 600;
  letter-spacing: 0.02em;
  border-radius: 20px;
}
.pill-guide:active { opacity: 0.8; transform: scale(0.96); }

.pill-hold {
  background: var(--surface2);
  color: var(--text3);
  cursor: pointer;
  font-size: 10px;
  padding: 3px 8px;
  font-weight: 600;
  border: 1px solid var(--border);
  border-radius: 20px;
  min-width: 92px;
  text-align: center;
  box-sizing: border-box;
}
.pill-hold.on {
  background: var(--amber-dim);
  color: var(--amber);
  border-color: transparent;
}
.pill-hold:active { opacity: 0.8; transform: scale(0.96); }
@keyframes pulse-flag {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}

.ex-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
  flex-shrink: 0;
}

.weight-input {
  width: 120px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--r-xs);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 12px;
  font-weight: 600;
  padding: 7px 6px;
  text-align: center;
  outline: none;
  -webkit-appearance: none;
  transition: border-color 0.15s;
}

.weight-input:focus { border-color: var(--accent); }

.prog {
  display: flex;
  align-items: center;
  gap: 6px;
}
.prog-row {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  min-height: 20px;
}
.prog-flag-row {
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: flex-end;
}
.flag-mid {
  display: flex;
  align-items: center;
  flex-shrink: 0;
}

.prog-track {
  width: 50px;
  height: 3px;
  background: var(--border2);
  border-radius: 2px;
  overflow: hidden;
}

.prog-fill {
  height: 100%;
  background: var(--green);
  border-radius: 2px;
  transition: width 0.4s;
}

.prog-pct {
  font-size: 10px;
  color: var(--text3);
  min-width: 26px;
  text-align: right;
  font-weight: 500;
}

/* MODAL */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 100;
  align-items: flex-end;
  padding-bottom: env(safe-area-inset-bottom, 0);
}

.overlay.open { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--r) var(--r) 0 0;
  padding: 24px 20px 32px;
  width: 100%;
}

.modal-handle {
  width: 36px;
  height: 4px;
  background: var(--border2);
  border-radius: 2px;
  margin: 0 auto 20px;
}

.modal-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--amber);
  background: var(--amber-dim);
  border-radius: 20px;
  padding: 3px 10px;
  margin-bottom: 10px;
}

.modal-badge.guide {
  color: var(--blue);
  background: var(--blue-dim);
}

.modal-badge.howto {
  color: var(--accent);
  background: rgba(232,255,90,0.12);
}

.info-dot {
  color: var(--text3);
  font-size: 12px;
  vertical-align: middle;
}

.modal-name {
  font-family: 'Syne', sans-serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
  letter-spacing: -0.01em;
}

.modal-desc {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.6;
  margin-bottom: 12px;
}

.modal-hint {
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
  background: var(--blue-dim);
  border-radius: var(--r-xs);
  padding: 10px 14px;
  margin-bottom: 20px;
}

.modal-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 8px;
}

.modal-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--r-sm);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 20px;
  font-weight: 700;
  padding: 14px 16px;
  outline: none;
  -webkit-appearance: none;
  margin-bottom: 16px;
  transition: border-color 0.15s;
}

.modal-input:focus { border-color: var(--accent); }

.modal-btns {
  display: flex;
  gap: 10px;
}

.modal-btns .btn { flex: 1; text-align: center; padding: 13px; font-size: 14px; }

/* TOAST */
.toast {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--green-dim);
  border: 1px solid var(--green);
  border-radius: 20px;
  padding: 10px 20px;
  font-size: 13px;
  font-weight: 600;
  color: var(--green);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s;
  z-index: 200;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">Pro<span>gression</span></div>
    <div class="stats-row">
      <div class="stat-chip">
        <div class="stat-chip-n" id="s-sess">0</div>
        <div class="stat-chip-l">Sessions</div>
      </div>
      <div class="stat-chip" id="flags-chip">
        <div class="stat-chip-n" id="s-flags">0</div>
        <div class="stat-chip-l">Flags</div>
      </div>
    </div>
  </div>
</div>

<div class="banner" id="banner">
  <div class="banner-dot" id="bdot"></div>
  <span id="btext"></span>
</div>

<div class="tabs-wrap">
  <div class="tabs" id="tabs"></div>
</div>

<div class="session">
  <div class="session-card">
    <div class="session-header">
      <div class="session-info">
        <div class="session-day" id="sday"></div>
        <div class="session-type" id="stype"></div>
      </div>
      <div class="session-btns">
        <button class="btn btn-ghost" onclick="skip()">Skip</button>
        <button class="btn btn-primary" onclick="complete()">Done ✓</button>
      </div>
    </div>
    <div id="exlist"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-badge" id="m-badge">Progression</div>
    <div class="modal-name" id="m-name"></div>
    <div class="modal-desc" id="m-desc"></div>
    <div class="modal-hint" id="m-hint"></div>
    <div id="m-weight-section">
      <div class="modal-label">New weight</div>
      <input class="modal-input" type="text" id="m-input" inputmode="text"/>
    </div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal()">Later</button>
      <button class="btn btn-primary" id="m-confirm" onclick="saveWeight()">Update</button>
    </div>
  </div>
</div>

<script>
// COACHING PROFILES — every exercise has a type and progression path
// EXERCISE DESCRIPTIONS — concise how-to + key cues
const DESCRIPTIONS = {
  // MONDAY — Push & legs
  'mon_dips':  {how:'Weighted dips on the bars, vest on. Lower until shoulders are just below elbows, then press up.', cues:['Lean forward for chest, upright for triceps','Elbows back, not flared','Full lockout at the top']},
  'mon_par':   {how:'Push-ups on the parallettes for a deeper range, vest on.', cues:['Lower past hand level for the extra stretch','Body in a straight line, brace the core','Control the descent']},
  'mon_dec':   {how:'Feet elevated, hands on the floor. Lower chest, press back up.', cues:['Higher feet = harder','Elbows ~45°','Full range, chest to floor']},
  'mon_sp':    {how:'Barbell overhead press from shoulders to lockout.', cues:['Brace, ribs down, no lean back','Bar finishes over the crown','Full lockout']},
  'mon_pike':  {how:'Hips high in an inverted V, lower the crown of your head toward the floor, press back up.', cues:['Hips stacked over shoulders','Lower under control','Press to full lockout']},
  'mon_ohe':   {how:'Overhead triceps extension with the barbell, elbows high.', cues:['Elbows stay pointing forward','Stretch at the bottom','Only the forearms move']},
  'mon_bss':   {how:'Rear foot on a bench, lower the back knee, drive up through the front foot.', cues:['Front shin near vertical','Drop straight down','Through the whole front foot']},
  'mon_le':    {how:'Leg extension machine, straighten the legs, squeeze, lower slow.', cues:['Squeeze the quads at the top','Slow negative','Full range']},
  'mon_cr':    {how:'Standing calf raise, full stretch at the bottom to full height at the top.', cues:['All the way up and down','Pause at the top','Add load via vest/held plate']},

  // WEDNESDAY — Pull & legs
  'wed_pu':    {how:'Pull-ups with the weight belt, palms away. Dead hang to chin over bar.', cues:['Full hang start, shoulders set','Drive elbows down','Control the descent']},
  'wed_cu':    {how:'Chin-ups with the belt, palms toward you.', cues:['Elbows tucked','Squeeze at the top','Slow negative']},
  'wed_awg':   {how:'Wide-grip Australian pull-ups under the bar, body straight.', cues:['Straight line, like a moving plank','Pull chest to bar','Squeeze shoulder blades']},
  'wed_acg':   {how:'Close-grip Australian pull-ups under the bar, body straight.', cues:['Body straight','Elbows close','Chest to bar']},
  'wed_cp':    {how:'Barbell chest pull / row movement, pull to the torso.', cues:['Lead with the elbows','Squeeze the back','Control back out']},
  'wed_sh':    {how:'Barbell shrugs — lift the shoulders straight up, squeeze, lower.', cues:['Straight up, not rolling','Squeeze at the top','Full lower for the stretch']},
  'wed_bc':    {how:'Barbell biceps curl, elbows at your sides.', cues:['No swinging','Elbows pinned','Full stretch at the bottom']},
  'wed_kb':    {how:'Kettlebell biceps curls.', cues:['Controlled, no swing','Squeeze at the top','Full range']},
  'wed_lp':    {how:'Single-leg press, lower under control to ~90°, press without locking hard.', cues:['Whole foot pressing','Knee tracks over toes','Back flat on the pad']},
  'wed_lc':    {how:'Leg curl machine, heels to glutes, squeeze, lower slow.', cues:['Hips down','Squeeze at the top','Slow negative']},

  // FRIDAY — Legs & conditioning
  'fri_bss':   {how:'Rear foot on a bench, lower the back knee, drive up through the front foot.', cues:['Front shin near vertical','Drop straight down','Through the whole front foot']},
  'fri_cr':    {how:'Standing calf raise, full range, pause at the top.', cues:['All the way up and down','Pause at the top','Add load to progress']},
  'fri_acg':   {how:'Close-grip Australian pull-ups under the bar.', cues:['Body straight','Elbows close','Chest to bar']},
  'fri_pp':    {how:'Plate chest pull / front raise hold with the plate.', cues:['Controlled throughout','Brace the core','No swinging']},
  'fri_d':     {how:'Dips on the bars, vest on.', cues:['Lean forward for chest','Elbows back','Full lockout']},
  'fri_dp':    {how:'Diamond push-ups — hands together under the chest.', cues:['Hands form a diamond','Elbows tight to the body','Full range']},
  'fri_wp':    {how:'Wide push-ups — hands wider than shoulders.', cues:['Wide hands, chest stretch','Body in a line','Full depth']},
  'fri_bo':    {how:'Push-up burnout — max clean reps to finish.', cues:['Keep form clean as you fatigue','Stop when form breaks','Empty the tank']},

  // SATURDAY — Upper body & core
  'sat_bc':    {how:'Barbell biceps curl, elbows at your sides.', cues:['No swinging','Elbows pinned','Full stretch']},
  'sat_cp':    {how:'Barbell chest pull / row, pull to torso.', cues:['Lead with elbows','Squeeze the back','Control out']},
  'sat_sp':    {how:'Barbell overhead press, shoulders to lockout.', cues:['Brace, no lean back','Bar over the crown','Full lockout']},
  'sat_ohe':   {how:'Overhead triceps extension with the barbell.', cues:['Elbows forward','Stretch at the bottom','Forearms only']},
  'sat_pl':    {how:'Plank — straight line head to heels, brace hard.', cues:['Squeeze glutes and abs','No hip sag','Breathe steadily']},
  'sat_db':    {how:'Dead bug — opposite arm and leg extend, back flat.', cues:['Lower back pressed down','Breathe out as you extend','Slow and controlled']},
  'sat_hr':    {how:'Hollow rocks — lower back glued to the floor, rock gently.', cues:['Keep the lower back down','Small controlled rocks','Tight hollow shape']},
  'sat_dr':    {how:'Dragonfly — lower the body as one straight line, control the descent.', cues:['Whole body rigid','Slow descent','Pull back up tight']},
  'sat_spl':   {how:'Side plank — straight line, hips up.', cues:['Stack the hips','Don’t let the hip drop','Brace the obliques']},
  'sat_sb':    {how:'Standing dumbbell side bend, bend to the side and back up.', cues:['Bend only sideways','Controlled, no twisting','Feel the obliques']},
};

const COACHING = {
  // WEIGHTED — flag after rep max hit, suggest weight increase
  'mon_dips':  {type:'weighted', suggest:'+2.5kg on vest', flag:'Weight increase', sessions:0},
  'mon_par':   {type:'vest',     suggest:'Add 2.3kg plate to vest', flag:'Vest load up', sessions:4},
  'mon_dec':   {type:'tempo',    flag:'Tempo progression',
    steps:['Slow it down — 3s down, 1s pause, 1s up','Push the tempo — 4s down, 2s pause, 1s up','Try decline diamond push-ups for added difficulty','Add vest 2.3kg and reset to 3s tempo']},
  'mon_sp':    {type:'weighted', suggest:'+5kg', flag:'Weight increase', sessions:0},

const DN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function allEx() {
  const a = [];
  DAYS.forEach(d => d.groups.forEach(g => g.ex.forEach(e => a.push(e))));
  return a;
}

function ld() { try { return JSON.parse(localStorage.getItem('prog_v8') || '{}'); } catch(e) { return {}; } }
function sv(s) { try { localStorage.setItem('prog_v8', JSON.stringify(s)); } catch(e) {} }

let S = ld();
if (!S.ex) S.ex = {};
if (!S.sess) S.sess = 0;
if (!S.upg) S.upg = 0;
if (!S.completed) S.completed = {};
if (!S.skipped) S.skipped = {};
if (!S.sessionCount) S.sessionCount = {};
if (!S.hold) S.hold = {};
function todayStr(){return new Date().toISOString().slice(0,10);}
function isDayDone(id){return S.completed[id]===todayStr();}
allEx().forEach(e => { if (!S.ex[e.id]) S.ex[e.id] = { reps: e.min, weight: e.weight, flagged: false }; });

const todayJS = new Date().getDay();
const todayI = DAYS.findIndex(d => d.jsDay === todayJS);
function nextI() {
  for (let i = 1; i <= 7; i++) {
    const c = (todayJS + i) % 7;
    const f = DAYS.findIndex(d => d.jsDay === c);
    if (f > -1) return f;
  }
  return 0;
}
let cur = todayI > -1 ? todayI : nextI();
let mTarget = null;

function dayFlags(id) {
  const d = DAYS.find(x => x.id === id);
  if (!d) return 0;
  let n = 0;
  d.groups.forEach(g => g.ex.forEach(e => { if (S.ex[e.id] && S.ex[e.id].flagged) n++; }));
  return n;
}

function totFlags() {
  let n = 0;
  allEx().forEach(e => { if (S.ex[e.id] && S.ex[e.id].flagged) n++; });
  return n;
}

function sug(e) {
  const c = COACHING[e.id];
  if (c && c.suggest) return c.suggest;
  if (e.compound) return 'Suggested: +5 kg — compound lift';
  if (e.weight && (e.weight.includes('BW') || e.weight.includes('vest') || e.weight.includes('belt'))) return 'Add more vest or belt weight';
  return 'Suggested: +2.5 kg';
}

function nextRestDay() {
  for (let i = 1; i <= 7; i++) {
    const jsDay = (todayJS + i) % 7;
    const isWorkout = DAYS.some(d => d.jsDay === jsDay);
    if (!isWorkout) return DN[jsDay];
  }
  return '—';
}

function renderBanner() {
  const dot = document.getElementById('bdot');
  const txt = document.getElementById('btext');
  if (todayI > -1) {
    dot.className = 'banner-dot active';
    txt.innerHTML = 'Today is your workout day · next rest day — <strong>' + nextRestDay() + '</strong>';
  } else {
    dot.className = 'banner-dot rest';
    txt.innerHTML = 'Today is your rest day · next workout: <strong>' + DAYS[nextI()].full + '</strong>';
  }
}

function renderTabs() {
  const c = document.getElementById('tabs');
  c.innerHTML = '';
  c.style.gridTemplateColumns = 'repeat(' + DAYS.length + ', 1fr)';
  DAYS.forEach((d, i) => {
    const f = dayFlags(d.id);
    const isToday = d.jsDay === todayJS;
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === cur ? ' active' : '') + (f > 0 ? ' flagged' : '');
    btn.innerHTML =
      '<span class="tab-label">' + d.label + (f > 0 ? ' <span class="tab-flag">⚑</span>' : '') + '</span>' +
      '<span class="tab-sub">' + d.sub + '</span>' +
      (isToday ? '<div class="tab-pip"></div>' : '');
    btn.onclick = () => { cur = i; renderSession(); renderTabs(); };
    c.appendChild(btn);
  });
}

function renderSession() {
  const day = DAYS[cur];
  const isToday = day.jsDay === todayJS;
  document.getElementById('sday').textContent = day.full + (isToday ? ' — today' : '');
  document.getElementById('stype').textContent = day.sub;
  const c = document.getElementById('exlist');
  c.innerHTML = '';

  day.groups.forEach(g => {
    const gl = document.createElement('div');
    gl.className = 'muscle-label';
    gl.textContent = g.name;
    c.appendChild(gl);

    g.ex.forEach(ex => {
      const xd = S.ex[ex.id];
      const isTimed = ex.timed;
      const isFixed = ex.min === ex.max;
      const pct = isFixed ? 100 : Math.round((xd.reps - ex.min) / (ex.max - ex.min) * 100);

      const row = document.createElement('div');
      row.className = 'ex' + (xd.flagged ? ' flagged' : '');

      const repPill = isTimed
        ? `<span class="pill pill-sets">${xd.weight}</span>`
        : `<span class="pill pill-reps"><span class="pill-sets">${ex.sets} sets</span><span class="pill-sep"> / </span>${xd.reps} reps${ex.min !== ex.max ? ' <span class="pill-range">('+ex.min+'–'+ex.max+')</span>' : ''}</span>`;

      const cInfo = COACHING[ex.id];
      const flagLabel = cInfo ? (cInfo.type === 'tempo' || cInfo.type === 'timed' ? '⚑ Progression tip' : '⚑ ' + cInfo.flag + ' tip') : '⚑ Increase weight tip';
      const flagPill = xd.flagged
        ? `<span class="pill pill-flag" onclick="openModal('${ex.id}')">${flagLabel}</span>`
        : '';

      const guidePill = (!xd.flagged && isWeightUnset(ex, xd) && !isTimed)
        ? `<span class="pill pill-guide" onclick="openRIRGuide('${ex.id}')">▸ Start guide</span>`
        : '';

      const bar = '';

      const held = S.hold && S.hold[ex.id];
      const holdPill = (!isTimed && cInfo && cInfo.type !== 'finisher')
        ? `<span class="pill pill-hold${held ? ' on' : ''}" onclick="toggleHold('${ex.id}')">${held ? '✓ Holding' : 'Couldn’t finish'}</span>`
        : '';

      row.innerHTML = `
        <div class="ex-info" onclick="openHowTo('${ex.id}')" style="cursor:pointer;">
          <div class="ex-name">${ex.name} <span class="info-dot">ⓘ</span></div>
          <div class="ex-pills">
            ${repPill}
          </div>
        </div>
        <div class="ex-right">
          <input class="weight-input" type="text" value="${xd.weight}" onclick="openWeightInput('${ex.id}')" readonly style="cursor:pointer;" />
          <div class="prog-row">
            ${xd.flagged ? flagPill : ''}
            ${guidePill}
            ${holdPill}
            ${bar}
          </div>
        </div>`;
      c.appendChild(row);
    });
  });
}

function updateStats() {
  document.getElementById('s-sess').textContent = S.sess;
  const f = totFlags();
  document.getElementById('s-flags').textContent = f;
  const num = document.getElementById('s-flags');
  if (f > 0) num.classList.add('amber'); else num.classList.remove('amber');
}

function updateDoneBtn() {
  const done = isDayDone(DAYS[cur].id);
  const btn = document.querySelector('.btn-primary');
  if (!btn) return;
  if (done) {
    btn.style.background = 'var(--accent)';
    btn.style.borderColor = 'var(--accent)';
    btn.style.color = '#0c0c0e';
    btn.textContent = 'Done ✓';
  } else {
    btn.style.background = 'transparent';
    btn.style.borderColor = 'var(--accent)';
    btn.style.color = 'var(--accent)';
    btn.textContent = 'Done ✓';
  }
}
function render() { renderBanner(); renderTabs(); renderSession(); updateStats(); updateDoneBtn(); updateSkipBtn(); }

function complete() {
  const dayId = DAYS[cur].id;
  if (isDayDone(dayId)) {
    delete S.completed[dayId];
    sv(S);
    updateDoneBtn();
    toast('Session unmarked');
    return;
  }
  DAYS[cur].groups.forEach(g => g.ex.forEach(ex => {
    const c = COACHING[ex.id];
    const xd = S.ex[ex.id];
    if (!c || c.type === 'finisher' || c.type === 'timed') return;
    // "Couldn't finish" — hold this exercise where it is, don't progress
    if (S.hold && S.hold[ex.id]) { delete S.hold[ex.id]; return; }
    if (c.type === 'weighted' || c.type === 'vest') {
      if (ex.min !== ex.max && !xd.flagged) {
        xd.reps = Math.min(xd.reps + 1, ex.max);
        if (xd.reps >= ex.max) xd.flagged = true;
      } else if (ex.min === ex.max && !xd.flagged) {
        if (!S.sessionCount[ex.id]) S.sessionCount[ex.id] = 0;
        S.sessionCount[ex.id]++;
        const threshold = c.sessions > 0 ? c.sessions : 4;
        if (S.sessionCount[ex.id] >= threshold) { xd.flagged = true; S.sessionCount[ex.id] = 0; }
      }
    } else if (c.type === 'tempo') {
      if (!S.sessionCount[ex.id]) S.sessionCount[ex.id] = 0;
      S.sessionCount[ex.id]++;
      if (S.sessionCount[ex.id] >= 4) { xd.flagged = true; S.sessionCount[ex.id] = 0; }
    }
  }));

  // also flag timed exercises
  DAYS[cur].groups.forEach(g => g.ex.forEach(ex => {
    const c = COACHING[ex.id];
    const xd = S.ex[ex.id];
    if (!c || c.type !== 'timed') return;
    if (!S.sessionCount[ex.id]) S.sessionCount[ex.id] = 0;
    S.sessionCount[ex.id]++;
    if (S.sessionCount[ex.id] >= 4) { xd.flagged = true; S.sessionCount[ex.id] = 0; }
  }));

  S.sess++;
  S.completed[dayId] = todayStr();
  sv(S);
  toast('Session complete — reps updated');
  render();
}

function skip() {
  const dayId = DAYS[cur].id;
  if (S.skipped && S.skipped[dayId] === todayStr()) {
    delete S.skipped[dayId];
    sv(S);
    updateSkipBtn();
    toast('Skip removed');
    return;
  }
  if (!S.skipped) S.skipped = {};
  S.skipped[dayId] = todayStr();
  sv(S);
  updateSkipBtn();
  toast('Session skipped — no reps added');
}

function isDaySkipped(dayId) { return S.skipped && S.skipped[dayId] === todayStr(); }

function updateSkipBtn() {
  const btn = document.querySelector('.btn-ghost:not(#modal .btn-ghost)');
  if (!btn) return;
  const skipped = isDaySkipped(DAYS[cur].id);
  btn.style.borderColor = skipped ? '#888890' : '';
  btn.style.background = skipped ? '#888890' : '';
  btn.style.color = skipped ? '#0c0c0e' : '';
}

function upW(id, val) {
  const ex = allEx().find(e => e.id === id);
  const xd = S.ex[id];
  xd.weight = val;
  if (xd.flagged) {
    xd.flagged = false;
    S.upg++;
    if (ex.min !== ex.max) xd.reps = ex.min;
    if (S.sessionCount[id]) S.sessionCount[id] = 0;
    toast('Weight updated — keep pushing!');
  }
  sv(S);
  render();
}

function getCoachStep(id) {
  const c = COACHING[id];
  if (!c || !c.steps) return null;
  const idx = Math.min(S.sessionCount[id] || 0, c.steps.length - 1);
  return c.steps[idx];
}

function toggleHold(id) {
  if (!S.hold) S.hold = {};
  if (S.hold[id]) delete S.hold[id];
  else S.hold[id] = true;
  sv(S);
  renderSession();
}

function openHowTo(id) {
  const ex = allEx().find(e => e.id === id);
  const d = DESCRIPTIONS[id];
  mTarget = id;
  document.getElementById('m-name').textContent = ex.name;
  document.getElementById('m-badge').textContent = 'How to perform';
  document.getElementById('m-badge').className = 'modal-badge howto';
  document.getElementById('m-desc').textContent = d ? d.how : '';
  document.getElementById('m-hint').innerHTML = d && d.cues
    ? d.cues.map(c => '• ' + c).join('<br>')
    : '';
  document.getElementById('m-weight-section').style.display = 'none';
  document.getElementById('m-confirm').style.display = 'none';
  document.querySelector('#overlay .btn-ghost').textContent = 'Close';
  document.getElementById('overlay').classList.add('open');
}

function isWeightUnset(ex, xd) {
  return !xd.weightSet;
}

function openWeightInput(id) {
  const ex = allEx().find(e => e.id === id);
  const xd = S.ex[id];
  if (isWeightUnset(ex, xd)) {
    openRIRGuide(id);
  } else {
    openModal(id);
  }
}

function openRIRGuide(id) {
  const ex = allEx().find(e => e.id === id);
  const xd = S.ex[id];
  mTarget = id;
  const isCompound = !!ex.compound;
  const rir = isCompound ? '2–3' : '4–5';
  const typeLabel = isCompound ? 'compound lift' : 'isolation exercise';
  const wLower = (xd.weight || '').toLowerCase();
  const hasAddedWeight = /\d\s*kg|\bbar\b|\bplate\b|\bvest\b|\bbelt\b|\bbb\b/.test(wLower);
  const isBodyweight = !hasAddedWeight && /\bbw\b|bodyweight|body weight|^$/.test(wLower);

  document.getElementById('m-name').textContent = ex.name;
  document.getElementById('m-badge').textContent = 'Start guide';
  document.getElementById('m-badge').className = 'modal-badge guide';
  document.getElementById('m-desc').textContent = isBodyweight
    ? 'Aim for ' + ex.min + ' clean reps (your minimum) with ' + rir + ' still left in the tank. Once that’s easy, add load or a harder variation.'
    : 'This is a ' + typeLabel + ' — pick a weight where you can hit ' + ex.min + ' reps (your minimum) with ' + rir + ' reps still left in the tank.';
  document.getElementById('m-hint').textContent = isBodyweight
    ? 'Progress by reps first, then add weight (vest/belt/plate) or a harder variation.'
    : (isCompound
      ? 'Compounds need heavier load — err on the side of challenging yourself.'
      : 'Isolation work fatigues fast — start conservative and build up.');
  document.getElementById('m-weight-section').style.display = 'block';
  document.getElementById('m-confirm').style.display = '';
  document.querySelector('#overlay .btn-ghost').textContent = 'Later';
  document.getElementById('m-confirm').textContent = 'Set weight';
  document.getElementById('m-input').value = '';
  document.getElementById('m-input').placeholder = 'e.g. ' + (xd.weight || ex.weight);
  document.getElementById('overlay').classList.add('open');
}

function openModal(id) {
  const ex = allEx().find(e => e.id === id);
  const xd = S.ex[id];
  const c = COACHING[id];
  mTarget = id;

  document.getElementById('m-name').textContent = ex.name;
  document.getElementById('m-badge').textContent = c ? c.flag : 'Progression';
  document.getElementById('m-badge').className = 'modal-badge';

  const ws = document.getElementById('m-weight-section');
  const confirmBtn = document.getElementById('m-confirm');
  confirmBtn.style.display = '';

  if (!c || c.type === 'weighted' || c.type === 'vest') {
    // Show weight input
    ws.style.display = 'block';
    confirmBtn.textContent = 'Update weight';
    document.querySelector('#overlay .btn-ghost').textContent = 'Later';
    if (c && c.type === 'vest') {
      document.getElementById('m-desc').textContent = 'You have completed enough sessions at this load. Time to add more vest weight.';
      document.getElementById('m-hint').textContent = c.suggest;
    } else {
      document.getElementById('m-desc').textContent = ex.min !== ex.max
        ? 'Hit the top of the rep range (' + ex.max + ' reps). Increase the weight and reps reset to ' + ex.min + '.'
        : 'Strong consistency — time to add more weight.';
      document.getElementById('m-hint').textContent = c ? c.suggest : sug(ex);
    }
    document.getElementById('m-input').value = xd.weight;
  } else {
    // Coaching only — no weight input
    ws.style.display = 'none';
    const step = getCoachStep(id);
    confirmBtn.style.display = '';
    confirmBtn.textContent = 'Move up';
    document.querySelector('#overlay .btn-ghost').textContent = 'Later';
    if (c.type === 'tempo') {
      document.getElementById('m-desc').textContent = 'Your body has adapted — the weight stays the same but the exercise gets harder.';
    } else if (c.type === 'timed') {
      document.getElementById('m-desc').textContent = 'Time to increase the challenge on this exercise.';
    }
    document.getElementById('m-hint').textContent = step || 'Keep pushing — great consistency.';
  }

  document.getElementById('overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  mTarget = null;
}

function saveWeight() {
  if (!mTarget) return;
  const c = COACHING[mTarget];
  const ex = allEx().find(e => e.id === mTarget);
  const xd = S.ex[mTarget];

  if (!c || c.type === 'weighted' || c.type === 'vest') {
    const val = document.getElementById('m-input').value.trim();
    if (!val) return;
    xd.weight = val;
    xd.weightSet = true;
    if (ex.min !== ex.max) xd.reps = ex.min;
    xd.flagged = false;
    S.upg++;
    sv(S);
    closeModal();
    toast('Weight updated — keep pushing!');
  } else {
    // Coaching acknowledged — advance step
    xd.flagged = false;
    if (!S.sessionCount[mTarget]) S.sessionCount[mTarget] = 0;
    S.sessionCount[mTarget] = Math.min(S.sessionCount[mTarget] + 1, (c.steps ? c.steps.length - 1 : 0));
    S.upg++;
    sv(S);
    closeModal();
    toast('Progression noted — apply next session!');
  }
  render();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

document.getElementById('overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

render();
</script>
</body>
</html>
